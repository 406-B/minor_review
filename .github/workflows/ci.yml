name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, test]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/backend/app

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-django coverage

      - name: Run Django migrations
        run: |
          python manage.py migrate --settings=app.settings_prod
        env:
          DJANGO_SETTINGS_MODULE: app.settings_prod

      - name: Run backend unit tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing -m "unit"
        env:
          DJANGO_SETTINGS_MODULE: app.settings_prod

      - name: Run backend integration tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing -m "integration"
        env:
          DJANGO_SETTINGS_MODULE: app.settings_prod

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./src/backend/app/coverage.xml
          flags: backend
          name: Backend Coverage

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:run -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./src/frontend/coverage/coverage-final.json
          flags: frontend
          name: Frontend Coverage

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd src/backend/app
          pip install -r requirements.txt

      - name: Run Django migrations
        run: |
          cd src/backend/app
          python manage.py migrate --settings=app.settings_prod
        env:
          DJANGO_SETTINGS_MODULE: app.settings_prod

      - name: Install frontend dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Build frontend
        run: |
          cd src/frontend
          npm run build

      - name: Start backend server
        run: |
          cd src/backend/app
          python manage.py runserver 0.0.0.0:8000 --settings=app.settings_prod &
          sleep 10

      - name: Start frontend server
        run: |
          cd src/frontend
          npm run preview -- --host 0.0.0.0 --port 3000 &
          sleep 10

      - name: Run E2E tests
        run: npx cypress run --spec "cypress/e2e/**/*.cy.js" --config baseUrl=http://localhost:3000

      - name: Run performance tests
        run: npx cypress run --spec "cypress/e2e/performance.cy.js" --config baseUrl=http://localhost:3000,video=false

  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          cd src/backend/app
          bandit -r . -f json -o bandit-report.json

      - name: Run Safety vulnerability check
        run: |
          cd src/backend/app
          safety check --output json > safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            src/backend/app/bandit-report.json
            src/backend/app/safety-report.json

  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, lint-and-format, security-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Generate test summary
        run: |
          echo "# 🧪 测试执行摘要" > test-summary.md
          echo "" >> test-summary.md
          echo "## 执行结果" >> test-summary.md
          echo "- ✅ 后端单元测试和集成测试" >> test-summary.md
          echo "- ✅ 前端单元测试" >> test-summary.md
          echo "- ✅ 端到端测试" >> test-summary.md
          echo "- ✅ 代码质量检查" >> test-summary.md
          echo "- ✅ 安全扫描" >> test-summary.md
          echo "" >> test-summary.md
          echo "## 测试覆盖" >> test-summary.md
          echo "- 后端：模型、视图、API端点" >> test-summary.md
          echo "- 前端：组件、API调用、路由" >> test-summary.md
          echo "- E2E：用户完整流程、性能测试" >> test-summary.md
          echo "" >> test-summary.md
          echo "## 执行时间: $(date)" >> test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: test-summary.md

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 部署到测试环境"
          # 这里可以添加实际的部署命令
          echo "部署完成"
