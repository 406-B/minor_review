[pytest]
# Django pytest 配置
DJANGO_SETTINGS_MODULE = app.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests *TestCase
python_functions = test_*
# 排除不需要测试的文件
norecursedirs = data_filing
addopts =
    --verbose
    --strict-markers
    --tb=short
    --ignore=data_filing
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    django_db: 需要数据库的测试

