[pytest]
# Django pytest 配置
DJANGO_SETTINGS_MODULE = app.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests *TestCase
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --no-migrations
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    django_db: 需要数据库的测试

