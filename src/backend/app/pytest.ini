[pytest]
# Django pytest 配置
DJANGO_SETTINGS_MODULE = app.test_settings
# 限制收集路径为 tests 目录（相对工作目录 /app）
testpaths = tests
# 恢复标准的测试文件名匹配，pytest 会在 `tests/` 目录中按此模式查找
python_files = test_*.py *_tests.py
python_classes = Test* *Tests *TestCase
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-config=.coveragerc
    --cov-report=html
    --cov-report=term-missing
    --no-migrations
    --disable-warnings
# 过滤来自第三方的 DeprecationWarning（临时抑制）
filterwarnings =
    ignore::DeprecationWarning:rest_framework_simplejwt
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    django_db: 需要数据库的测试

