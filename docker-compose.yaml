version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    ports:
      - "33306:3306"  # 映射到主机33306端口，避免与本地MySQL冲突
    container_name: minor_review_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: database
      MYSQL_DATABASE: minor_review
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # phpMyAdmin 数据库管理界面
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: minor_review_phpmyadmin
    restart: always
    ports:
      - "8080:80"  # 通过 http://localhost:8080 访问
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: database
      MYSQL_ROOT_PASSWORD: database
      UPLOAD_LIMIT: 50M
    networks:
      - backend_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django 后端服务 (可扩展多实例)
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: app.settings_prod
      DJANGO_SECRET_KEY: django-insecure-prod-key-auto-generated-2025
      DJANGO_ALLOWED_HOSTS: "*"
      MYSQL_DATABASE: minor_review
      MYSQL_USER: root
      MYSQL_PASSWORD: database
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      JWT_SECRET: jwt-secret-key-auto-generated-2025
      PASSWORD_SALT: password-salt-auto-generated-2025
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - backend_network
      - nginx_network
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2  # 运行 2 个后端实例实现负载均衡
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vue 前端服务
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: minor_review_frontend
    restart: always
    networks:
      - nginx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理和负载均衡
  nginx:
    image: nginx:latest
    container_name: minor_review_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"  # HTTPS 端口（如需要）
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/static:ro
      - nginx_logs:/var/log/nginx
    networks:
      - nginx_network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # 前端网络：Nginx 和后端服务
  nginx_network:
    driver: bridge
    name: minor_review_nginx_net
  
  # 后端网络：后端服务和数据库
  backend_network:
    driver: bridge
    name: minor_review_backend_net

volumes:
  mysql_data:
    name: minor_review_mysql_data
  media_data:
    name: minor_review_media
  static_data:
    name: minor_review_static
  nginx_logs:
    name: minor_review_nginx_logs
