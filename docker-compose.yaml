version: '3.8'

services:
  # MySQL 数据库（不暴露公网端口）
  db:
    image: mysql:8.0
    # ports 已移除 - 不对外暴露端口，仅内网访问
    container_name: minor_review_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: database
      MYSQL_DATABASE: minor_review
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # Redis 缓存服务（带密码保护，不暴露公网）
  redis:
    image: redis:7-alpine
    container_name: minor_review_redis
    restart: always
    # ports 已移除 - 不对外暴露端口，仅内网访问
    networks:
      - backend_network
    environment:
      - REDIS_PASSWORD=Minor_Review_Redis_2025_Secure_Pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Minor_Review_Redis_2025_Secure_Pass", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes --requirepass Minor_Review_Redis_2025_Secure_Pass
    volumes:
      - redis_data:/data

  # phpMyAdmin 数据库管理界面（仅通过 Nginx 代理访问，需管理员权限）
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: minor_review_phpmyadmin
    restart: always
    # ports 已移除 - 通过 Nginx 反向代理访问 /phpmyadmin/
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://43.143.148.157/phpmyadmin/
      UPLOAD_LIMIT: 50M
      # 不设置默认用户，必须手动登录
    networks:
      - backend_network
      - nginx_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django 后端服务
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: minor_review_backend
    restart: always
    shm_size: '2gb'  # Chrome需要的共享内存
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: app.settings_prod
      DJANGO_SECRET_KEY: django-insecure-prod-key-auto-generated-2025
      DJANGO_ALLOWED_HOSTS: "*"
      MYSQL_DATABASE: minor_review
      MYSQL_USER: root
      MYSQL_PASSWORD: database
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: Minor_Review_Redis_2025_Secure_Pass
      REDIS_DB: 0
      JWT_SECRET: jwt-secret-key-auto-generated-2025
      PASSWORD_SALT: password-salt-auto-generated-2025
      DEEPSEEK_API_KEY: sk-6ca4652a7c6f42e2b84564aaca772eb0
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1,http://43.143.148.157"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1,http://43.143.148.157"
    volumes:
      - ./src/backend/app/media:/app/media
      - static_data:/app/staticfiles
    networks:
      - backend_network
      - nginx_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vue 前端服务
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: minor_review_frontend
    restart: always
    networks:
      - nginx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理和负载均衡
  nginx:
    image: nginx:latest
    container_name: minor_review_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"  # HTTPS 端口（如需要）
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/backend/app/media:/app/media:ro
      - static_data:/app/static:ro
      - nginx_logs:/var/log/nginx
    networks:
      - nginx_network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # 前端网络：Nginx 和后端服务
  nginx_network:
    driver: bridge
    name: minor_review_nginx_net
  
  # 后端网络：后端服务和数据库
  backend_network:
    driver: bridge
    name: minor_review_backend_net

volumes:
  mysql_data:
    name: minor_review_mysql_data
  redis_data:
    name: minor_review_redis_data
  static_data:
    name: minor_review_static
  nginx_logs:
    name: minor_review_nginx_logs
