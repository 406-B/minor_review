# 后端服务器组（负载均衡）
upstream backend_servers {
    # 使用 least_conn 算法，将请求分配给连接数最少的服务器
    least_conn;
    
    # Docker Compose 会自动为 replicas 创建服务发现
    # backend_1, backend_2, etc.
    server backend:8000 max_fails=3 fail_timeout=30s;
    
    # 如果需要手动指定多个后端实例，可以这样配置：
    # server backend_1:8000 weight=1 max_fails=3 fail_timeout=30s;
    # server backend_2:8000 weight=1 max_fails=3 fail_timeout=30s;
    
    # 保持连接
    keepalive 32;
}

# 主服务器配置
server {
    listen 80;
    server_name localhost;
    
    # 客户端请求体大小限制
    client_max_body_size 20M;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # API 请求代理到后端（负载均衡）
    location /api/ {
        proxy_pass http://backend_servers;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（如需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 禁用缓冲以支持 SSE
        proxy_buffering off;
        
        # 保持连接
        proxy_set_header Connection "";
    }
    
    # 媒体文件（用户上传）
    location /media/ {
        alias /app/media/;
        
        # 缓存策略
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # 安全头
        add_header X-Content-Type-Options nosniff;
    }
    
    # 静态文件（Django admin 等）
    location /static/ {
        alias /app/static/;
        
        # 缓存策略
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 前端应用
    location / {
        proxy_pass http://frontend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SPA 应用支持
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
    
    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 后端健康检查
    location /backend-health {
        access_log off;
        proxy_pass http://backend_servers/api/v1/health/;
        proxy_set_header Host $host;
    }
}

